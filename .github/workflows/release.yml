name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag, publisher and repository
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          publisher="$(node -p "require('./package.json').publisher")"
          repository="${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match package.json version v$version"
            exit 1
          fi
          if [[ "$publisher" != 'levkosyk' ]]; then
            echo '::error::The publisher must be levkosyk.'
            exit 1
          fi
          if [[ "$repository" != 'levkosyk/transform' ]]; then
            echo '::error::Releases are allowed only from LevKosyk/Transform.'
            exit 1
          fi
          if ! grep -Fxq "## $version" changelog.md; then
            echo "::warning::changelog.md has no '## $version' section; the release notes will be generated from commits only."
          fi

  ci:
    name: CI
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify GIF links will be public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != 'false' ]]; then
            echo '::error::The repository must be public for README GIFs to appear in the Marketplace.'
            exit 1
          fi

      - name: Package VSIX with public GIF links
        shell: bash
        run: |
          vsix="transform-${GITHUB_REF_NAME#v}.vsix"
          npx vsce package \
            --no-dependencies \
            --baseContentUrl "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA" \
            --baseImagesUrl "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA" \
            --out "$vsix"
          test -s "$vsix"
          echo "VSIX=$vsix" >> "$GITHUB_ENV"

      - name: Prepare Open VSX namespace and token
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ -z "$OVSX_PAT" ]]; then
            echo '::notice::OVSX_PAT is not configured; skipping Open VSX.'
            exit 0
          fi
          namespace="$(node -p "require('./package.json').publisher")"
          if ! curl -fsS "https://open-vsx.org/api/$namespace" >/dev/null; then
            echo "Creating Open VSX namespace $namespace"
            npx ovsx create-namespace "$namespace"
          fi
          npx ovsx verify-pat "$namespace"
          echo "OPEN_VSX=true" >> "$GITHUB_ENV"

      - name: Authenticate to Microsoft Entra ID
        if: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to VS Code Marketplace
        shell: bash
        env:
          USE_ENTRA_ID: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ "$USE_ENTRA_ID" == 'true' ]]; then
            npx vsce publish --packagePath "$VSIX" --azure-credential --skip-duplicate
          elif [[ -n "$VSCE_PAT" ]]; then
            npx vsce publish --packagePath "$VSIX" --skip-duplicate
          else
            echo '::error::Configure Entra ID OIDC variables or the VSCE_PAT repository secret.'
            exit 1
          fi

      - name: Publish to Open VSX
        if: ${{ env.OPEN_VSX == 'true' }}
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --packagePath "$VSIX" --skip-duplicate

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' changelog.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" "$VSIX" \
            --verify-tag \
            --generate-notes \
            --notes-file release-notes.md \
            --title "Transform $GITHUB_REF_NAME"
