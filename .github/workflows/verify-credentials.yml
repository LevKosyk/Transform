name: Verify credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace:
    name: VS Code Marketplace token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify VSCE_PAT can publish as the package publisher
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo '::error::The VSCE_PAT secret is not set.'
            exit 1
          fi
          publisher="$(node -p "require('./package.json').publisher")"
          npx --yes @vscode/vsce@3.9.2 verify-pat "$publisher"

  open-vsx:
    name: Open VSX token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the namespace if needed and verify OVSX_PAT
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ -z "$OVSX_PAT" ]]; then
            echo '::error::The OVSX_PAT secret is not set.'
            exit 1
          fi
          namespace="$(node -p "require('./package.json').publisher")"
          if ! curl -fsS "https://open-vsx.org/api/$namespace" >/dev/null; then
            echo "Creating Open VSX namespace $namespace"
            npx --yes ovsx@1.2.0 create-namespace "$namespace"
          fi
          npx --yes ovsx@1.2.0 verify-pat "$namespace"
